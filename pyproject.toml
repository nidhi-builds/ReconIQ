[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconiq"
version = "0.1.0"
description = "Multi-source finance reconciliation engine"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "google-genai>=1,<2",
    "pydantic>=2.12,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "python-dotenv>=1,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider -m 'not live'"
markers = [
    "live: calls an external provider and may consume quota",
]
